<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Backend log viewer for Media Vault.">
        <title>System Logs - Media Vault</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    </head>
    <body class="bg-slate-950 text-slate-300 p-8">
        <div class="max-w-5xl mx-auto" x-data="logViewer()">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-white">Backend Debug Logs</h1>
                <div class="flex gap-4">
                    <a href="{{ url_for('index') }}"
                       class="text-sm bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg transition">Back to App</a>
                    <button @click="fetchLogs()"
                            class="text-sm bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg transition">
                        Refresh Now
                    </button>
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
                <div class="bg-slate-800/50 p-3 border-b border-slate-800 flex justify-between text-xs font-bold uppercase tracking-widest text-slate-500">
                    <span>System Events (Last 200)</span>
                    <span x-text="'Auto-refreshing...'"></span>
                </div>
                <div class="p-4 font-mono text-xs h-[70vh] overflow-y-auto space-y-1"
                     id="logContainer">
                    <template x-for="log in logs">
                        <div class="hover:bg-slate-800/30 p-1 rounded transition border-l-2 border-transparent hover:border-blue-500">
                            <span :class="log.includes('ERROR') ? 'text-red-400' : (log.includes('WARNING') ? 'text-orange-400' : 'text-slate-500')"
                                  x-text="log"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        <script>
        function logViewer() {
            return {
                logs: [],
                init() {
                    this.fetchLogs();
                    setInterval(() => this.fetchLogs(), 3000);
                },
                async fetchLogs() {
                    try {
                        const r = await fetch('/api/system/logs');
                        const d = await r.json();
                        this.logs = d.logs.reverse(); // Newest at top
                    } catch (e) { console.error("Log fetch failed", e); }
                }
            }
        }
        </script>
    </body>
</html>
